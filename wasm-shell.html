<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>suiCune</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071016;
      --text: #e6f4f1;
      --muted: #91aaa8;
      --accent: #6ee7d8;
      --line: #29424a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #0b1720; }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .keys { color: var(--muted); font-size: 13px; }
    main { display: grid; place-items: center; padding: 16px; }
    .stage { position: relative; width: min(100%, 960px); display: grid; gap: 12px; justify-items: center; }
    canvas.emscripten { width: min(100%, 960px); max-height: calc(100vh - 150px); aspect-ratio: 160 / 144; image-rendering: pixelated; background: #000; border: 1px solid var(--line); outline: none; }
    canvas.emscripten:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110, 231, 216, 0.25); }
    #status { color: var(--accent); min-height: 20px; font-size: 14px; }
    progress { width: min(100%, 420px); height: 8px; accent-color: var(--accent); }
    .note { color: var(--muted); font-size: 13px; text-align: center; max-width: 760px; }
    .touch-controls { display: none; }

    @media (hover: none) and (pointer: coarse), (max-width: 820px) {
      html, body { width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #000; }
      *, *::before, *::after {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { display: block; touch-action: none; }
      header {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        z-index: 30;
        padding: 0;
        border: 0;
        background: transparent;
        pointer-events: none;
      }
      h1 { font-size: 13px; text-shadow: 0 1px 8px #000; opacity: 0.85; }
      .keys { display: none; }
      main {
        width: 100vw;
        height: 100dvh;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }
      .stage {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: #000;
      }
      canvas.emscripten {
        width: min(100vw, 177.7778dvh);
        height: min(100dvh, 56.25vw);
        max-width: 100vw;
        max-height: 100dvh;
        aspect-ratio: 16 / 9;
        border: 0;
        box-shadow: none;
        object-fit: fill;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas.emscripten:focus { box-shadow: none; }
      #status {
        position: fixed;
        z-index: 35;
        top: max(30px, calc(env(safe-area-inset-top) + 26px));
        left: 50%;
        min-height: 0;
        transform: translateX(-50%);
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.42);
        color: var(--accent);
        font-size: 12px;
        line-height: 1;
      }
      progress {
        position: fixed;
        z-index: 35;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        width: min(58vw, 320px);
        transform: translateX(-50%);
      }
      .note { display: none; }
      body.is-running #status,
      body.is-running progress { display: none; }
      .touch-controls {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .touch-cluster {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
      }
      .touch-button {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(110, 231, 216, 0.38);
        border-radius: 999px;
        background: rgba(6, 17, 24, 0.24);
        color: rgba(230, 244, 241, 0.78);
        box-shadow: inset 0 0 18px rgba(110, 231, 216, 0.08), 0 6px 20px rgba(0, 0, 0, 0.16);
        font: 700 16px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-shadow: 0 1px 8px #000;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        touch-action: none;
      }
      .touch-button.is-pressed {
        background: rgba(110, 231, 216, 0.32);
        border-color: rgba(230, 244, 241, 0.72);
        color: #fff;
      }
      .touch-dpad {
        left: max(14px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(3, clamp(48px, 12vw, 72px));
        grid-template-rows: repeat(3, clamp(48px, 12vw, 72px));
        gap: 6px;
      }
      .touch-dpad .touch-button { width: 100%; height: 100%; border-radius: 18px; }
      .touch-spacer { pointer-events: none; }
      .touch-actions {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(52px, calc(env(safe-area-inset-bottom) + 34px));
        width: clamp(132px, 30vw, 190px);
        height: clamp(104px, 23vw, 150px);
      }
      .touch-actions .touch-button {
        position: absolute;
        width: clamp(58px, 13vw, 82px);
        height: clamp(58px, 13vw, 82px);
      }
      .touch-a { right: 0; top: 0; }
      .touch-b { left: 0; bottom: 0; }
      .touch-menu {
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
        transform: translateX(-50%);
      }
      .touch-menu .touch-button {
        min-width: clamp(54px, 14vw, 82px);
        height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12px;
      }
      .touch-reset { min-width: 42px !important; }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: portrait), (max-width: 520px) and (orientation: portrait) {
      .stage {
        align-items: flex-start;
        padding-top: max(42px, calc(env(safe-area-inset-top) + 36px));
      }
      canvas.emscripten {
        width: min(106.6667dvh, 924px);
        height: min(60dvh, 520px);
        max-width: none;
        max-height: none;
      }
      .touch-dpad {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(88px, calc(env(safe-area-inset-bottom) + 76px));
        grid-template-columns: repeat(3, clamp(40px, 14vw, 56px));
        grid-template-rows: repeat(3, clamp(40px, 14vw, 56px));
      }
      .touch-actions {
        right: max(14px, env(safe-area-inset-right));
        bottom: max(116px, calc(env(safe-area-inset-bottom) + 100px));
        width: clamp(112px, 36vw, 148px);
        height: clamp(94px, 31vw, 124px);
      }
      .touch-actions .touch-button {
        width: clamp(52px, 15vw, 68px);
        height: clamp(52px, 15vw, 68px);
      }
      .touch-menu { bottom: max(12px, env(safe-area-inset-bottom)); }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: portrait) and (max-height: 740px), (max-width: 520px) and (orientation: portrait) and (max-height: 740px) {
      .stage { padding-top: max(36px, calc(env(safe-area-inset-top) + 30px)); }
      canvas.emscripten {
        width: min(96dvh, 640px);
        height: min(54dvh, 360px);
      }
      .touch-dpad {
        bottom: max(70px, calc(env(safe-area-inset-bottom) + 58px));
        grid-template-columns: repeat(3, clamp(38px, 13vw, 52px));
        grid-template-rows: repeat(3, clamp(38px, 13vw, 52px));
      }
      .touch-actions {
        bottom: max(96px, calc(env(safe-area-inset-bottom) + 82px));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>suiCune</h1>
    <div class="keys">Move: arrows | A: Z | B: X | Start: Enter | Select: Backspace | Reset: R</div>
  </header>
  <main>
    <div class="stage">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" autofocus></canvas>
      <div class="touch-controls" aria-label="Touch controls">
        <div class="touch-cluster touch-dpad" aria-label="D-pad">
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="6" aria-label="Up">&uarr;</button>
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="5" aria-label="Left">&larr;</button>
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="4" aria-label="Right">&rarr;</button>
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="7" aria-label="Down">&darr;</button>
          <span class="touch-spacer"></span>
        </div>
        <div class="touch-cluster touch-actions" aria-label="Action buttons">
          <button class="touch-button touch-a" type="button" data-key="0" aria-label="A">A</button>
          <button class="touch-button touch-b" type="button" data-key="1" aria-label="B">B</button>
        </div>
        <div class="touch-cluster touch-menu" aria-label="Menu buttons">
          <button class="touch-button" type="button" data-key="2" aria-label="Select">Select</button>
          <button class="touch-button" type="button" data-key="3" aria-label="Start">Start</button>
          <button class="touch-button touch-reset" type="button" data-action="restart" aria-label="Restart">R</button>
        </div>
      </div>
      <div id="status">Downloading...</div>
      <progress id="progress" max="100" value="0"></progress>
      <div class="note">Click the game screen once before using the keyboard.</div>
    </div>
  </main>
  <script>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var canvasElement = document.getElementById('canvas');
    var touchControlsElement = document.querySelector('.touch-controls');
    function focusGameCanvas() {
      try {
        canvasElement.focus({ preventScroll: true });
      } catch (error) {
        canvasElement.focus();
      }
    }
    var heldJoypadKeys = {};
    var touchKeyPressCounts = {};
    var activeTouchPointers = {};
    var restartInProgress = false;
    function joypadKeyFromEvent(event) {
      switch (event.code) {
        case 'KeyZ': return 0;       // A
        case 'KeyX': return 1;       // B
        case 'Backspace': return 2;  // Select
        case 'Enter': return 3;      // Start
        case 'ArrowRight': return 4;
        case 'ArrowLeft': return 5;
        case 'ArrowUp': return 6;
        case 'ArrowDown': return 7;
        default: return -1;
      }
    }
    function setJoypadKey(key, pressed) {
      if (key < 0 || !Module || !Module._wasm_set_joypad_key) {
        return;
      }
      Module._wasm_set_joypad_key(key, pressed ? 1 : 0);
    }
    function updateJoypadKeyState(key) {
      setJoypadKey(key, !!heldJoypadKeys[key] || !!touchKeyPressCounts[key]);
    }
    function clearJoypadKeys() {
      heldJoypadKeys = {};
      touchKeyPressCounts = {};
      activeTouchPointers = {};
      document.querySelectorAll('.touch-button.is-pressed').forEach(function(button) {
        button.classList.remove('is-pressed');
      });
      for (var key = 0; key <= 7; key++) {
        setJoypadKey(key, false);
      }
    }
    function consumeGameKeyEvent(event) {
      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) {
        event.stopImmediatePropagation();
      }
    }
    function isTouchOptimizedLayout() {
      return window.matchMedia('(hover: none) and (pointer: coarse), (max-width: 820px)').matches;
    }
    function blockMobileSelectionEvent(event) {
      if (isTouchOptimizedLayout()) {
        consumeGameKeyEvent(event);
      }
    }
    ['contextmenu', 'selectstart', 'dragstart'].forEach(function(type) {
      document.addEventListener(type, blockMobileSelectionEvent, { capture: true });
    });
    function flushGameSaveToDisk() {
      if (Module && Module._wasm_flush_save) {
        Module._wasm_flush_save();
      }
    }
    var saveSyncInProgress = false;
    var saveSyncQueued = false;
    var saveSyncTimer = null;
    function mountSaveFileSystem() {
      try {
        FS.mkdir('/save');
      } catch (error) {
        if (error && error.errno !== 20) {
          console.warn('Save directory already exists or could not be created:', error);
        }
      }
      try {
        FS.mount(IDBFS, {}, '/save');
      } catch (error) {
        if (!String(error && error.message).match(/mount point is already in use/i)) {
          throw error;
        }
      }
    }
    function syncSaveFileSystem(populate, done) {
      if (typeof FS === 'undefined' || typeof IDBFS === 'undefined') {
        if (done) done(new Error('IDBFS is unavailable'));
        return;
      }
      if (!populate) {
        flushGameSaveToDisk();
      }
      if (saveSyncInProgress) {
        saveSyncQueued = true;
        if (done) done();
        return;
      }
      saveSyncInProgress = true;
      FS.syncfs(populate, function(error) {
        saveSyncInProgress = false;
        if (error) {
          console.error('Save sync failed:', error);
        } else {
          window.__suicuneLastSaveSync = Date.now();
        }
        if (done) done(error);
        if (saveSyncQueued) {
          saveSyncQueued = false;
          syncSaveFileSystem(false);
        }
      });
    }
    function startSaveSyncTimer() {
      if (saveSyncTimer) {
        return;
      }
      saveSyncTimer = window.setInterval(function() {
        syncSaveFileSystem(false);
      }, 5000);
    }
    function restartGame() {
      if (restartInProgress) {
        return;
      }
      restartInProgress = true;
      clearJoypadKeys();
      if (typeof Module !== 'undefined' && Module.setStatus) {
        Module.setStatus('Restarting...');
      }
      var didReload = false;
      function reloadOnce() {
        if (didReload) {
          return;
        }
        didReload = true;
        window.location.reload();
      }
      try {
        syncSaveFileSystem(false, function() {
          window.setTimeout(reloadOnce, 50);
        });
        window.setTimeout(reloadOnce, 750);
      } catch (error) {
        console.error('Restart save sync failed:', error);
        reloadOnce();
      }
    }
    function setTouchKey(key, pressed) {
      var current = touchKeyPressCounts[key] || 0;
      touchKeyPressCounts[key] = Math.max(0, current + (pressed ? 1 : -1));
      if (!touchKeyPressCounts[key]) {
        delete touchKeyPressCounts[key];
      }
      updateJoypadKeyState(key);
    }
    function releaseTouchPointer(pointerId) {
      var active = activeTouchPointers[pointerId];
      if (!active) {
        return;
      }
      active.button.classList.remove('is-pressed');
      setTouchKey(active.key, false);
      delete activeTouchPointers[pointerId];
    }
    if (touchControlsElement) {
      touchControlsElement.addEventListener('pointerdown', function(event) {
        var button = event.target.closest('button');
        if (!button) {
          return;
        }
        consumeGameKeyEvent(event);
        focusGameCanvas();
        if (button.dataset.action === 'restart') {
          if (!restartInProgress) {
            restartGame();
          }
          return;
        }
        var key = Number(button.dataset.key);
        if (!Number.isInteger(key)) {
          return;
        }
        button.classList.add('is-pressed');
        activeTouchPointers[event.pointerId] = { button: button, key: key };
        setTouchKey(key, true);
        try {
          button.setPointerCapture(event.pointerId);
        } catch (error) {
          // Some mobile browsers reject pointer capture during synthetic tests.
        }
      }, { capture: true });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function(type) {
        touchControlsElement.addEventListener(type, function(event) {
          consumeGameKeyEvent(event);
          releaseTouchPointer(event.pointerId);
        }, { capture: true });
      });
    }
    canvasElement.addEventListener('pointerdown', focusGameCanvas);
    window.addEventListener('load', focusGameCanvas);
    window.addEventListener('keydown', function(event) {
      var key = joypadKeyFromEvent(event);
      if (key !== -1 || event.code === 'KeyR') {
        consumeGameKeyEvent(event);
        focusGameCanvas();
        if (event.code === 'KeyR') {
          if (!event.repeat) {
            restartGame();
          }
          return;
        }
        if (key !== -1) {
          heldJoypadKeys[key] = true;
          updateJoypadKeyState(key);
        }
      }
    }, { capture: true });
    window.addEventListener('keyup', function(event) {
      var key = joypadKeyFromEvent(event);
      if (key !== -1 || event.code === 'KeyR') {
        consumeGameKeyEvent(event);
        if (key !== -1) {
          delete heldJoypadKeys[key];
          updateJoypadKeyState(key);
        }
      }
    }, { capture: true });
    window.addEventListener('blur', clearJoypadKeys);
    window.addEventListener('pagehide', function() {
      syncSaveFileSystem(false);
    });
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        clearJoypadKeys();
        syncSaveFileSystem(false);
      }
    });
    var Module = {
      canvas: canvasElement,
      preRun: [function() {
        try {
          mountSaveFileSystem();
          Module.addRunDependency('sync-local-save');
          syncSaveFileSystem(true, function() {
            Module.removeRunDependency('sync-local-save');
          });
        } catch (error) {
          console.error('Local save setup failed:', error);
        }
      }],
      print: function(text) { console.log(text); },
      printErr: function(text) {
        console.error(text);
        if (/abort|error|exception/i.test(text)) {
          statusElement.textContent = text;
        }
      },
      setStatus: function(text) {
        statusElement.textContent = text || 'Running';
        document.body.classList.toggle('is-running', !text || text === 'Running');
        var match = text && text.match(/([0-9]+)\/([0-9]+)/);
        if (match) {
          progressElement.value = Number(match[1]) * 100;
          progressElement.max = Number(match[2]) * 100;
          progressElement.hidden = false;
        } else if (!text) {
          progressElement.hidden = true;
        }
      },
      totalDependencies: 0,
      locateFile: function(path, prefix) {
        if (path === 'index.wasm' || path === 'index.data') {
          return prefix + path + '?v=20260528-1743';
        }
        return prefix + path;
      },
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Starting...');
      },
      onRuntimeInitialized: function() {
        Module.setStatus('Running');
        focusGameCanvas();
        startSaveSyncTimer();
        Object.keys(heldJoypadKeys).forEach(function(key) {
          updateJoypadKeyState(Number(key));
        });
      }
    };
    window.onerror = function(message, source, lineno, colno, error) {
      Module.setStatus('Error: ' + message);
      console.error(message, source, lineno, colno, error);
    };
  </script>
