<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>suiCune</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071016;
      --text: #e6f4f1;
      --muted: #91aaa8;
      --accent: #6ee7d8;
      --line: #29424a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #0b1720; }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .auth-logout {
      margin: 0;
      padding: 7px 12px;
      border: 1px solid #2f505a;
      border-radius: 999px;
      background: rgba(23, 45, 57, 0.7);
      color: #d8fdff;
      font-size: 13px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      pointer-events: auto;
      z-index: 40;
    }
    .auth-logout:hover {
      background: rgba(110, 231, 216, 0.18);
      color: #ecfdff;
    }
    main { display: grid; place-items: center; padding: 16px; }
    .stage { position: relative; width: min(100%, 960px); display: grid; gap: 12px; justify-items: center; }
    canvas.emscripten { width: min(100%, 960px); max-height: calc(100vh - 150px); aspect-ratio: 160 / 144; image-rendering: pixelated; background: #000; border: 1px solid var(--line); outline: none; }
    canvas.emscripten:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110, 231, 216, 0.25); }
    #status { color: var(--accent); min-height: 20px; font-size: 14px; }
    progress { width: min(100%, 420px); height: 8px; accent-color: var(--accent); }
    .note { color: var(--muted); font-size: 13px; text-align: center; max-width: 760px; }
    .hidden { display: none !important; }
    #auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background-color: #071016;
      background-image: linear-gradient(rgba(7, 16, 22, 0.72), rgba(7, 16, 22, 0.84)), url('login-desktop-overlay-chatgpt.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 18px;
      box-sizing: border-box;
      --field-left: 60.85%;
      --field-width: 27.75%;
      --field-gap: 8px;
      --field-height: 7.9%;
      --user-top: 40.35%;
      --pass-top: 47.8%;
      --actions-top: 58.95%;
      --actions-left: 58.45%;
      --actions-width: 27.75%;
      --status-top: 73.2%;
      --toggle-top: 79.2%;
    }
    #auth-overlay .card {
      position: relative;
      width: min(860px, 92vw);
      aspect-ratio: 1672 / 941;
      max-height: min(72vh, 540px);
      border-radius: 16px;
      border: 0;
      padding: 0;
      overflow: hidden;
      box-shadow: none;
      background: url('login-desktop-overlay-chatgpt.png') center / cover no-repeat;
      backdrop-filter: none;
    }
    #auth-overlay h2 {
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
      width: 0;
      height: 0;
    }
    #auth-overlay .field {
      margin-bottom: 10px;
      background: transparent;
      border: 0;
      box-shadow: none;
      pointer-events: none;
    }
    #auth-overlay .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      border: 0;
      white-space: nowrap;
    }
    #auth-overlay label { display: block; }
    #auth-overlay input {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      color: #ffffff;
      caret-color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      appearance: none;
      -webkit-appearance: none;
      font-size: 16px;
      padding: 6px 12% 6px 6%;
      letter-spacing: 0.25px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
      outline: 0;
      box-shadow: none;
      border-radius: 0;
      pointer-events: auto;
    }
    #auth-overlay input::placeholder {
      color: transparent;
    }
    #auth-form .field-username,
    #auth-form .field-password {
      position: absolute;
      left: var(--field-left);
      width: var(--field-width);
      height: var(--field-height);
      top: var(--user-top);
      background: transparent;
      border: 0;
      box-shadow: none;
      border-radius: 0;
      pointer-events: auto;
    }
    #auth-form .field-password {
      top: var(--pass-top);
    }
    #auth-error,
    #auth-success {
      position: absolute;
      left: 50%;
      top: var(--status-top);
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      pointer-events: none;
    }
    #auth-overlay button {
      display: block;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: transparent;
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 700;
      border-radius: 0;
      padding: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      text-shadow: none;
      outline: 0;
      box-shadow: none;
    }
    #auth-overlay .actions {
      margin: 0;
      position: absolute;
      left: var(--actions-left);
      width: var(--actions-width);
      top: var(--actions-top);
      height: var(--field-height);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #auth-error { color: #ff8b8b; min-height: 18px; font-size: 13px; margin-top: 8px; }
    #auth-success { color: #aef5ef; min-height: 18px; font-size: 13px; margin-top: 8px; }
    #auth-toggle {
      position: absolute;
      left: 50%;
      top: calc(var(--status-top) + 26px);
      transform: translateX(-50%);
      display: block;
      color: #89d3fb;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      text-align: center;
    }
    .auth-footnote {
      color: #dbf7f5;
      font-size: 12px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      text-align: center;
      bottom: 18px;
    }
    .touch-controls { display: none; }

    @media (hover: none) and (pointer: coarse), (max-width: 820px) {
      #auth-overlay {
        padding: 0;
        background-color: #000;
        background-image: none;
        --field-left: 14.65%;
        --field-width: 71.28%;
        --field-height: 5.55%;
        --user-top: 62.9%;
        --pass-top: 69.52%;
        --actions-top: 76.46%;
        --actions-left: 12.65%;
        --actions-width: 71.28%;
        --toggle-top: 94.1%;
        --status-top: 82.6%;
      }
      #auth-overlay .card {
        width: min(100vw, calc(100dvh * 853 / 1844));
        height: min(100dvh, calc(100vw * 1844 / 853));
        max-width: none;
        max-height: none;
        aspect-ratio: 853 / 1844;
        border-radius: 0;
        background: url('login-mobile-overlay-chatgpt.png') center / contain no-repeat;
      }
      #auth-overlay .field,
      #auth-overlay .actions,
      #auth-overlay #auth-toggle,
      #auth-overlay .auth-footnote,
      #auth-overlay #auth-error,
      #auth-overlay #auth-success {
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      }
      #auth-overlay .auth-footnote,
      #auth-overlay #auth-toggle {
        font-size: 12px;
      }
      #auth-overlay h2 {
        font-size: 0;
      }
      #auth-overlay input {
        padding-left: 17%;
        padding-right: 14%;
      }
      #auth-overlay button {
        color: #ffffff;
        -webkit-text-fill-color: #ffffff;
        font-size: clamp(18px, 5.2vw, 26px);
        letter-spacing: 0;
        text-shadow: 0 1px 4px rgba(0, 20, 65, 0.45);
      }
      #auth-overlay #auth-toggle {
        top: var(--toggle-top);
        width: 48%;
        height: 4%;
        color: transparent;
        text-decoration: none;
        font-size: 1px;
      }
      #auth-overlay .auth-footnote {
        display: none;
      }
      html, body { width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #000; }
      *, *::before, *::after {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { display: block; touch-action: none; }
      header {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        z-index: 30;
        padding: 0;
        border: 0;
        background: transparent;
      }
      h1 { font-size: 13px; text-shadow: 0 1px 8px #000; opacity: 0.85; }
      .auth-logout {
        pointer-events: auto;
        padding: 6px 10px;
        font-size: 12px;
        margin: 0;
      }
      main {
        width: 100vw;
        height: 100dvh;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }
      .stage {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: #000;
      }
      canvas.emscripten {
        width: min(100vw, 177.7778dvh);
        height: min(100dvh, 56.25vw);
        max-width: 100vw;
        max-height: 100dvh;
        aspect-ratio: 16 / 9;
        border: 0;
        box-shadow: none;
        object-fit: fill;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas.emscripten:focus { box-shadow: none; }
      #status {
        position: fixed;
        z-index: 35;
        top: max(30px, calc(env(safe-area-inset-top) + 26px));
        left: 50%;
        min-height: 0;
        transform: translateX(-50%);
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.42);
        color: var(--accent);
        font-size: 12px;
        line-height: 1;
      }
      progress {
        position: fixed;
        z-index: 35;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        width: min(58vw, 320px);
        transform: translateX(-50%);
      }
      .note { display: none; }
      body.is-running #status,
      body.is-running progress { display: none; }
      .touch-controls {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .touch-cluster {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
      }
      .touch-button {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(110, 231, 216, 0.38);
        border-radius: 999px;
        background: rgba(6, 17, 24, 0.24);
        color: rgba(230, 244, 241, 0.78);
        box-shadow: inset 0 0 18px rgba(110, 231, 216, 0.08), 0 6px 20px rgba(0, 0, 0, 0.16);
        font: 700 16px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-shadow: 0 1px 8px #000;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        touch-action: none;
      }
      .touch-button.is-pressed {
        background: rgba(110, 231, 216, 0.32);
        border-color: rgba(230, 244, 241, 0.72);
        color: #fff;
      }
      .touch-dpad {
        left: max(14px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(3, clamp(48px, 12vw, 72px));
        grid-template-rows: repeat(3, clamp(48px, 12vw, 72px));
        gap: 6px;
      }
      .touch-dpad .touch-button { width: 100%; height: 100%; border-radius: 18px; }
      .touch-spacer { pointer-events: none; }
      .touch-actions {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(52px, calc(env(safe-area-inset-bottom) + 34px));
        width: clamp(132px, 30vw, 190px);
        height: clamp(104px, 23vw, 150px);
      }
      .touch-actions .touch-button {
        position: absolute;
        width: clamp(58px, 13vw, 82px);
        height: clamp(58px, 13vw, 82px);
      }
      .touch-a { right: 0; top: 0; }
      .touch-b { left: 0; bottom: 0; }
      .touch-menu {
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
        transform: translateX(-50%);
      }
      .touch-menu .touch-button {
        min-width: clamp(54px, 14vw, 82px);
        height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12px;
      }
      .touch-reset { min-width: 42px !important; }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: portrait), (max-width: 520px) and (orientation: portrait) {
      .stage {
        align-items: flex-start;
        padding-top: max(42px, calc(env(safe-area-inset-top) + 36px));
      }
      canvas.emscripten {
        width: min(97.7778dvh, 848px);
        height: min(55dvh, 477px);
        max-width: none;
        max-height: none;
      }
      .touch-dpad {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(88px, calc(env(safe-area-inset-bottom) + 76px));
        grid-template-columns: repeat(3, clamp(40px, 14vw, 56px));
        grid-template-rows: repeat(3, clamp(40px, 14vw, 56px));
      }
      .touch-actions {
        right: max(14px, env(safe-area-inset-right));
        bottom: max(116px, calc(env(safe-area-inset-bottom) + 100px));
        width: clamp(112px, 36vw, 148px);
        height: clamp(94px, 31vw, 124px);
      }
      .touch-actions .touch-button {
        width: clamp(52px, 15vw, 68px);
        height: clamp(52px, 15vw, 68px);
      }
      .touch-menu { bottom: max(12px, env(safe-area-inset-bottom)); }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: portrait) and (max-height: 740px), (max-width: 520px) and (orientation: portrait) and (max-height: 740px) {
      .stage { padding-top: max(36px, calc(env(safe-area-inset-top) + 30px)); }
      canvas.emscripten {
        width: min(88.8889dvh, 594px);
        height: min(50dvh, 334px);
      }
      .touch-dpad {
        bottom: max(70px, calc(env(safe-area-inset-bottom) + 58px));
        grid-template-columns: repeat(3, clamp(38px, 13vw, 52px));
        grid-template-rows: repeat(3, clamp(38px, 13vw, 52px));
      }
      .touch-actions {
        bottom: max(96px, calc(env(safe-area-inset-bottom) + 82px));
      }
    }
  </style>
  <script src="/t/tracker.js" data-api="/t/api/track" defer></script>
</head>
<body>
  <header>
    <button id="auth-logout" class="auth-logout hidden" type="button">Logout</button>
  </header>
  <main>
    <div class="stage">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" autofocus></canvas>
      <div class="touch-controls" aria-label="Touch controls">
        <div class="touch-cluster touch-dpad" aria-label="D-pad">
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="6" aria-label="Up">&uarr;</button>
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="5" aria-label="Left">&larr;</button>
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="4" aria-label="Right">&rarr;</button>
          <span class="touch-spacer"></span>
          <button class="touch-button" type="button" data-key="7" aria-label="Down">&darr;</button>
          <span class="touch-spacer"></span>
        </div>
        <div class="touch-cluster touch-actions" aria-label="Action buttons">
          <button class="touch-button touch-a" type="button" data-key="0" aria-label="A">A</button>
          <button class="touch-button touch-b" type="button" data-key="1" aria-label="B">B</button>
        </div>
        <div class="touch-cluster touch-menu" aria-label="Menu buttons">
          <button class="touch-button" type="button" data-key="2" aria-label="Select">Select</button>
          <button class="touch-button" type="button" data-key="3" aria-label="Start">Start</button>
          <button class="touch-button touch-reset" type="button" data-action="restart" aria-label="Restart">R</button>
        </div>
      </div>
      <div id="status">Downloading...</div>
      <progress id="progress" max="100" value="0"></progress>
      <div class="note">Click the game screen once before using the keyboard.</div>
    </div>
  </main>
  <div id="auth-overlay">
    <form class="card" id="auth-form" autocomplete="on">
      <h2 id="auth-title">Play with account</h2>
      <div class="field field-username">
        <label for="auth-username" class="sr-only">Username</label>
        <input id="auth-username" placeholder="Login" autocomplete="username" required />
      </div>
      <div class="field field-password">
        <label for="auth-password" class="sr-only">Password</label>
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required />
      </div>
      <div class="actions">
        <button type="submit" id="auth-submit">Sign in</button>
      </div>
      <span id="auth-error" role="status" aria-live="polite"></span>
      <span id="auth-success" role="status" aria-live="polite"></span>
      <a id="auth-toggle" href="#">Need to create an account?</a>
      <div class="auth-footnote">Login is stored on this domain and tied to your save files.</div>
    </form>
  </div>
  <script>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var canvasElement = document.getElementById('canvas');
    var touchControlsElement = document.querySelector('.touch-controls');
    var authOverlayElement = document.getElementById('auth-overlay');
    var authFormElement = document.getElementById('auth-form');
    var authTitleElement = document.getElementById('auth-title');
    var authUsernameElement = document.getElementById('auth-username');
    var authPasswordElement = document.getElementById('auth-password');
    var authSubmitButton = document.getElementById('auth-submit');
    var authLogoutButton = document.getElementById('auth-logout');
    var authToggleElement = document.getElementById('auth-toggle');
    var authErrorElement = document.getElementById('auth-error');
    var authSuccessElement = document.getElementById('auth-success');
    var authMode = 'login';
    var authIsSubmitting = false;
    var authUserId = null;
    var authUsername = '';
    var isGameBooted = false;
    var gameHasUser = false;
    var gameRuntimeReady = false;
    var saveSyncInProgress = false;
    var saveSyncQueued = false;
    var saveSyncTimer = null;
    var assetVersion = '20260604-gbc-authlogout';
    function setGameStatus(text) {
      if (statusElement) {
        statusElement.textContent = text;
      }
    }
    function sanitizeText(value) {
      return String(value || '').trim();
    }
    function setAuthMessage(type, message) {
      if (type === 'error') {
        authErrorElement.textContent = message || '';
        authSuccessElement.textContent = '';
      } else {
        authSuccessElement.textContent = message || '';
        authErrorElement.textContent = '';
      }
    }
    function clearAuthMessages() {
      setAuthMessage('error', '');
      setAuthMessage('success', '');
    }
    function showAuthError(message) {
      setAuthMessage('error', message);
    }
    function showAuthSuccess(message) {
      setAuthMessage('success', message);
    }
    function showAuthOverlay() {
      setAuthHeaderState(false);
      if (authOverlayElement) {
        authOverlayElement.classList.remove('hidden');
      }
      if (authFormElement) {
        authFormElement.querySelector('input') && authFormElement.querySelector('input').focus();
      }
    }
    function hideAuthOverlay() {
      if (authOverlayElement) {
        authOverlayElement.classList.add('hidden');
      }
      clearAuthMessages();
    }
    function setAuthHeaderState(loggedIn) {
      if (!authLogoutButton) {
        return;
      }
      if (loggedIn) {
        authLogoutButton.classList.remove('hidden');
      } else {
        authLogoutButton.classList.add('hidden');
      }
    }
    function setAuthMode(nextMode) {
      authMode = nextMode === 'register' ? 'register' : 'login';
      if (!authTitleElement || !authSubmitButton || !authPasswordElement || !authToggleElement) {
        return;
      }
      clearAuthMessages();
      if (authMode === 'register') {
        authTitleElement.textContent = 'Create account';
        authSubmitButton.textContent = 'Sign up';
        authToggleElement.textContent = 'Already have an account?';
        authPasswordElement.setAttribute('autocomplete', 'new-password');
      } else {
        authTitleElement.textContent = 'Play with account';
        authSubmitButton.textContent = 'Sign in';
        authToggleElement.textContent = 'Need to create an account?';
        authPasswordElement.setAttribute('autocomplete', 'current-password');
      }
      authUsernameElement.focus();
    }
    function requestJson(path, init) {
      var options = init || {};
      if (!options.headers) {
        options.headers = {};
      }
      if (options.body && typeof options.body !== 'string' && !(options.body instanceof FormData)) {
        options.body = JSON.stringify(options.body);
        options.headers['Content-Type'] = 'application/json';
      }
      return fetch(path, Object.assign({}, options, { credentials: 'include' }));
    }
    function trackAuthEvent(action, username) {
      var trackFn = window.townrankerTrack;
      if (typeof trackFn !== 'function') {
        return;
      }
      try {
        trackFn('form_submit', {
          formName: 'Authentication',
          formId: 'pokemon-auth-form',
          formAction: action === 'signup' ? '/api/auth/register' : '/api/auth/login',
          formIntent: action,
          submitText: action === 'signup' ? 'Sign up' : 'Sign in',
          formFieldNames: ['username', 'password'],
          text: String(username || '').trim(),
        });
      } catch (error) {}
    }
    function syncAuthModeFromResponse(responseText, isRegister) {
      if (responseText && responseText.user) {
        authUserId = responseText.user.id;
        authUsername = responseText.user.username;
        gameHasUser = true;
      }
      if (isRegister && responseText && responseText.created) {
        showAuthSuccess('Account created, loading your save files...');
      }
    }
    function hydrateAuthFromSession() {
      if (!authOverlayElement) {
        return Promise.resolve(false);
      }
      return requestJson('/api/auth/me')
        .then(function(response) {
          if (!response.ok) {
